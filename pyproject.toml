[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-cert-expiry-sentinel"
version = "0.1.0"
description = "Offline certificate expiry and configuration audit for OCI-style certificate exports"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
oci-cert-sentinel = "oci_cert_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
